<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
 
 
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam">
       <a-marker preset="kanji" >
        <a-box position=" 0 0.3 -0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
        <a-box position=" 0 0.3 0.0" color="orange" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
        <a-box position=" 0 0.3 0.3" color="yellow" width="0.3" height="0.2" depth="0.9" rotation="0 90 0" dynamic-body></a-box>
       </a-marker>
       <a-entity camera></a-entity>
    </a-scene>
   
</body>
</html>
