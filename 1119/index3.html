<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="icon" href="data:,">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.3.0/vr-kit.js"></script>
    <style>
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;
        }

        select {
            font-size: 18px;
            padding: 4px 8px;
            width: 200px;
        }
        
        footer {
            position: fixed;
            bottom: 8px;
            left: 10px;
            z-index: 999;
            font-size: 12px;
            color: #222;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="hud">
        <select name="" id="avatarChoice">
            <option value="robot.glb">ロボット</option>
            <option value="wolf.glb">狼</option>
        </select>
        <p id="countText">0 / 3</p>
        <p id="resultText"></p>
    </div>

    <a-scene>
        <a-sky color="lightblue"></a-sky>
        
        <a-entity id="map" gltf-model="Camp.glb" position="0 0 0" 
        scale="3 3 3" walkable></a-entity>

        <a-entity gltf-model="cabin.glb"
        position="-7 0.5 0" scale="1 1 1"></a-entity>

        <a-entity id="avatar" gltf-model="robot.glb" position="2 0 -2" scale="0.1 0.1 0.1" avatar="
            view:third;
            avatarDirection:180;
            walk: Robot_Walking;
            idle: Robot_Wave;
            cameraFollow:false;
            moveSpeed: 1;
            ">
        </a-entity>

        <a-box id="box1" color="gold" position="0 0.2 5" scale="0.3 0.3 0.3"></a-box><!--寝巻きの隣-->
        <a-box id="box2" color="gold" position="4.8 0.2 3.8" scale="0.3 0.3 0.3"></a-box><!--木の切り株-->
        <a-box id="box3" color="gold" position="1 0.2 -5" scale="0.3 0.3 0.3"></a-box><!--テントの裏-->
    </a-scene>

    <!--AIにfooterのデザインを整えてもらいました-->
    <footer>Camping Asset Collection by Alex Safayan [CC-BY] (https://creativecommons.org/licenses/by/3.0/) via Poly Pizza (https://poly.pizza/m/3nj59_uuCbM)</footer>

    <script>
        const avatar = document.getElementById("avatar");
        const avatarChoice = document.getElementById("avatarChoice");

        function changeAvatar() {
            if (avatarChoice.value === "wolf.glb") {
                avatar.setAttribute("gltf-model", avatarChoice.value);
                avatar.setAttribute("scale", "0.5 0.5 0.5");
                avatar.setAttribute(
                    "avatar-motion", {
                    walk: "Gallop",
                    idle: "Idle"
                })
            }

            if (avatarChoice.value === "robot.glb") {
                avatar.setAttribute("gltf-model", avatarChoice.value);
                avatar.setAttribute("scale", "0.3 0.3 0.3");
                avatar.setAttribute(
                    "avatar-motion", {
                    walk: "Robot_Walking",
                    idle: "Robot_Wave"
                })
            }
        }
        avatarChoice.addEventListener("change", changeAvatar);

        const box1 = document.getElementById("box1");
        const box2 = document.getElementById("box2");
        const box3 = document.getElementById("box3");

        const countText = document.getElementById("countText");
        const resultText = document.getElementById("resultText");

        let count = 0;
        let isCleared = false;

        const clearSound = new Audio("clear.mp3");

        let box1Aru = true;
        let box2Aru = true;
        let box3Aru = true;

        function checkBox() {
            if (box1Aru === true && isNear(avatar, box1, 1.5)) {
                box1Aru = false;
                box1.setAttribute("visible", false);
                count = count + 1;
            }

            if (box2Aru === true && isNear(avatar, box2, 1.5)) {
                box2Aru = false;
                box2.setAttribute("visible", false);
                count = count + 1;
            }
            if (box3Aru === true && isNear(avatar, box3, 1.5)) {
                box3Aru = false;
                box3.setAttribute("visible", false);
                count = count + 1;
            }
            countText.textContent = count + "/3";

            if (count === 3 && !isCleared) {
                isCleared = true;
                resultText.textContent = "ゲームクリア!";
                avatar.setAttribute("avatar", "enabled", false);

                clearSound.currentTime = 0;
                clearSound.play().catch((err) => {
                    console.log("音声の再生に失敗しました:", err);
                });
            }
        }

        setInterval(checkBox, 100);
    </script>
</body>

</html>
