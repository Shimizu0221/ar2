<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="icon" href="data:,">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.3.0/vr-kit.js"></script>
    <style>
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;
        }

        select {
            font-size: 18px;
            padding: 4px 8px;
            width: 200px;
        }
    </style>
</head>

<body>
    <div id="hud">
        <select name="" id="avatarChoice">
            <option value="robot.glb">ロボット</option>
            <option value="wolf.glb">狼</option>
        </select>
    </div>

    <a-scene>
        <a-sky color="lightblue"></a-sky>
        
        <a-entity id="map" gltf-model="sabaku.glb" position="0 0 0" 
        scale="0.3 0.3 0.3" walkable></a-entity>

        <a-entity gltf-model="cabin.glb"
        position="-7 0.5 0" scale="15 15 15"></a-entity>

        <a-entity id="avatar" gltf-model="robot.glb" position="0 0 -3" scale="0.3 0.3 0.3" avatar="
            view:third;
            avatarDirection:180;
            walk: Robot_Walking;
            idle: Robot_Wave;
            cameraFollow:false;
            moveSpeed: 1;
            ">
        </a-entity>

        <a-box id="box1" color="gold" position="0 1 -5"></a-box>
    </a-scene>

    <script>
        const avatar = document.getElementById("avatar");
        const avatarChoice = document.getElementById("avatarChoice");

        function changeAvatar() {
            if (avatarChoice.value === "wolf.glb") {
                avatar.setAttribute("gltf-model", avatarChoice.value);
                avatar.setAttribute("scale", "0.5 0.5 0.5");
                avatar.setAttribute(
                    "avatar-motion", {
                    walk: "Gallop",
                    idle: "Idle"
                })
            }

            if (avatarChoice.value === "robot.glb") {
                avatar.setAttribute("gltf-model", avatarChoice.value);
                avatar.setAttribute("scale", "0.3 0.3 0.3");
                avatar.setAttribute(
                    "avatar-motion", {
                    walk: "Robot_Walking",
                    idle: "Robot_Wave"
                })
            }
        }
        avatarChoice.addEventListener("change", changeAvatar);
    </script>
</body>


</html>
