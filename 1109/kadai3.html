<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
<style>
    html,
    body{
        width:100%;
        height:100%;
        margin: 0;
        overflow: hidden;
    }

    #hud{
        position:fixed;
        top:20px;
        left:20px;
        z-index:999;
    }
    
    button{
        font-size: 18px;
        padding: 10px;
    }
</style>
</head>
<body>
    <div id="hud">
        <button id="megane1Btn">ミーム風コスチューム</button>
        <button id="megane2Btn">パーティー風コスチューム</button>
        <button id="megane3Btn">運動用コスチューム</button>
    </div>
    <a-scene id="scene" mindar-face embedded>
        <a-entity id="face" mindar-face-target="anchorIndex:168">
             <a-gltf-model id="accesory"></a-gltf-model>
             <a-gltf-model id="hat"></a-gltf-model>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>
    <script>
        const accesory = document.getElementById("accesory");
        const hat = document.getElementById("hat");
        const megane1Btn = document.getElementById("megane1Btn");
        const megane2Btn = document.getElementById("megane2Btn");
        const megane3Btn = document.getElementById("megane3Btn");

        function toMegane1(){
            accesory.setAttribute("src","../assets/images/megane1.glb");
            accesory.setAttribute("position","-0.07 0 -0.1");
            accesory.setAttribute("rotation","0 -180 0");
            accesory.setAttribute("scale","0.7 0.7 0.7");

            hat.setAttribute("src","../assets/images/santahat.glb");
            hat.setAttribute("position","-0.2 1 -1");
            hat.setAttribute("rotation","10 0 0");
            hat.setAttribute("scale","10 7 7");
        }

        megane1Btn.addEventListener("click",toMegane1);

        function toMegane2(){
            
            accesory.setAttribute("src","../assets/images/partymegane.glb");
            accesory.setAttribute("position","0 0 -0.1");
            accesory.setAttribute("rotation","0 0 0");
            accesory.setAttribute("scale","0.55 0.55 0.55");

            hat.setAttribute("src","../assets/images/foxhat.glb");
            hat.setAttribute("position","0 0.5 -0.2"); 
            hat.setAttribute("rotation","0 0 0");
            hat.setAttribute("scale","2.2 1 1.5");
        }

        megane2Btn.addEventListener("click",toMegane2);

        function toMegane3(){

            accesory.setAttribute("src","../assets/images/megane4.glb");
            accesory.setAttribute("position","0 0 -0.1");
            accesory.setAttribute("rotation","0 0 0");
            accesory.setAttribute("scale","0.55 0.55 0.55");

            hat.setAttribute("src","../assets/images/cap.glb");
            hat.setAttribute("position","0.22 0.6 -0.4");
            hat.setAttribute("rotation","30 0 0");
            hat.setAttribute("scale","0.7 0.5 0.5");
        }
        
        megane3Btn.addEventListener("click",toMegane3);

    </script>
</body>
</html>
